services:
    docker-practice-app:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        restart: unless-stopped
        ports:
            - "${PORT:-3000}:3000"
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docker-practice-postgres:5432/${POSTGRES_DB}?schema=public
            - REDIS_URL=redis://:${REDIS_PASSWORD}@docker-practice-redis:6379
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            docker-practice-postgres:
                condition: service_healthy
            docker-practice-redis:
                condition: service_healthy

    docker-practice-app-prod:
        profiles: ["prod"]
        build:
            context: .
            dockerfile: Dockerfile
            target: prod
        restart: unless-stopped
        ports:
            - "${PORT:-3000}:3000"
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@docker-practice-postgres:5432/${POSTGRES_DB}?schema=public
            - REDIS_URL=redis://:${REDIS_PASSWORD}@docker-practice-redis:6379
        depends_on:
            docker-practice-postgres:
                condition: service_healthy
            docker-practice-redis:
                condition: service_healthy

    docker-practice-postgres:
        image: postgres:18
        restart: unless-stopped
        ports:
            - "5432:5432"
        env_file:
            - .env
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-docker_practice}"]
            interval: 5s
            timeout: 5s
            retries: 5

    docker-practice-redis:
        image: redis:8
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
        restart: unless-stopped
        ports:
            - "6379:6379"
        env_file:
            - .env
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres-data:
    redis-data: